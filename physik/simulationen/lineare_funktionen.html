ight:600;font-size:25px;line-height:1.18;letter-spacing:-.7px;margin-top:12px;outline:none}.instruction{font-size:15px;line-height:1.55;margin-top:17px}.observation{color:var(--muted);font-size:13px;line-height:1.55;margin-top:9px}.parameters{margin-top:24px;display:grid;gap:24px}.parameter-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.parameter-label label{font-size:13px;font-weight:600}.parameter-label i{font-size:19px;margin-left:4px}.parameter-m i{color:var(--green)}.parameter-b i{color:var(--amber)}input[type=number]{width:79px;border:1px solid var(--line);border-radius:7px;background:white;padding:6px 5px 6px 9px;font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink)}input[type=range]{width:100%;accent-color:var(--green);height:20px;display:block;margin:0;cursor:pointer}.parameter-b input[type=range]{accent-color:var(--amber)}input:disabled{opacity:.45;cursor:default}.range-limits{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px}.guide-footer{padding:17px 6px 0 0}.readiness{font-size:12px;color:var(--muted);min-height:18px;margin-bottom:9px}.primary{background:var(--green);border:1px solid var(--green);border-radius:8px;color:white;width:100%;min-height:43px;padding:11px 16px;font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:14px}.primary:hover:not(:disabled){background:#195e4c}.primary:disabled{background:#e7ece5;color:#839187;border-color:#e7ece5;opacity:1}.next-hint{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.4}.text-button{border:0;padding:0;background:transparent;text-decoration:none;font-size:11px;color:var(--muted)}.text-button:hover{text-decoration:underline;color:var(--green)}#restartButton{margin-top:14px}.answers{display:grid;gap:8px;margin-top:22px}.answers button{text-align:left;background:white;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:13px;line-height:1.4}.answers button:hover:not(:disabled){border-color:var(--green)}.answers button[aria-pressed=true]{border-color:var(--green);background:var(--green-light)}.answers button.wrong{border-color:#b87e57;background:#faf0e8}.answers button:disabled{opacity:1}.feedback{border-left:3px solid var(--green);padding:10px 0 10px 13px;font-size:13px;line-height:1.55;margin-top:18px;background:transparent}.feedback.retry{border-color:var(--amber)}.graph-section{min-width:0;min-height:0;background:white;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}.graph-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:21px 27px 5px}.equation{font:26px/1.5 Georgia,"Times New Roman",serif;letter-spacing:.1px;margin-top:4px;color:#344d43}.equation .active-m{color:var(--green);background:#edf5ef;border-radius:4px;padding:0 3px}.equation .active-b{color:var(--amber);background:#fbf1e3;border-radius:4px;padding:0 3px}.fixed-note{font-size:11px;color:var(--muted);white-space:nowrap}.graph-stage{flex:1;min-height:260px;position:relative}.graph-stage svg{display:block;width:100%;height:100%;touch-action:none}#lineGraph [data-param]{cursor:ns-resize}#lineGraph [data-param]:focus-visible{outline:none}#lineGraph [data-param]:focus-visible .handle-ring{stroke:#172d26;stroke-width:3}.graph-tools{display:flex;gap:7px;flex-wrap:wrap;padding:3px 24px 9px}.graph-tools button{border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:11px;background:white}.graph-tools button[aria-pressed=true]{border-color:var(--green);color:var(--green);background:var(--green-light)}.graph-note{color:var(--muted);font-size:11px;padding:5px 26px 15px;line-height:1.4}.values-panel{border-top:1px solid var(--line);margin:0 26px 8px;padding-top:9px}.probe-control{display:flex;align-items:center;gap:12px;font-size:11px}.probe-control input{flex:1;min-width:35px}.probe-control output{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--green);font-weight:600}table{width:100%;border-collapse:collapse;font-size:11px;margin-top:7px}th,td{text-align:center;border-top:1px solid #eef1ec;padding:4px 7px;font-variant-numeric:tabular-nums}th{text-align:left;color:var(--muted);font-weight:500}.page-footer{display:flex;align-items:center;justify-content:space-between;padding-top:15px;font-size:11px;color:#7a887f;gap:15px}.free-selectors{display:grid;gap:6px;margin-top:18px}.free-selectors label{font-size:11px;color:var(--muted)}select{width:100%;border:1px solid var(--line);border-radius:7px;background:white;padding:8px;color:var(--ink);font-size:12px}.free-selectors label:not(:first-child){margin-top:6px}.model-note{font-size:11px;line-height:1.5;color:var(--muted);margin-top:16px}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

@media(max-width:760px){.shell{width:calc(100% - 28px);padding-top:17px}.page-header{padding-bottom:17px}h1{font-size:23px}.eyebrow{font-size:9px}.back-link{font-size:11px}.steps{margin-bottom:18px}.steps button{flex-direction:column;gap:7px;font-size:10px;padding:11px 2px;text-align:center}.step-number{width:23px;height:23px}.experiment{height:auto;min-height:0;display:flex;flex-direction:column;gap:18px}.guide{display:contents}.guide-content{overflow:visible;padding:0}.guide h2{font-size:24px;margin-top:8px}.instruction{margin-top:10px}.observation{margin-top:5px}.parameters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:18px}.parameter-label{flex-wrap:wrap;gap:7px}.parameter-label label{flex-basis:100%;min-height:26px}.parameters:has(.parameter[hidden]){grid-template-columns:1fr}.parameters:has(.parameter[hidden]) .parameter-label{flex-wrap:nowrap}.parameters:has(.parameter[hidden]) .parameter-label label{flex-basis:auto;min-height:0}.graph-section{height:420px;order:1}.guide-footer{order:2;padding:0}.graph-stage{min-height:220px}.graph-header{padding:16px 16px 0}.graph-note{padding:4px 16px 12px}.graph-tools{padding-left:16px;padding-right:16px}.values-panel{margin-left:16px;margin-right:16px}.page-footer{margin-top:10px;align-items:flex-start}.page-footer span{max-width:47%}.page-footer button{max-width:47%;text-align:right}.answers{margin-top:16px}.free-selectors{grid-template-columns:1fr 1fr;gap:6px 12px}.free-selectors label{grid-row:1}.free-selectors label:not(:first-child){margin-top:0}.free-selectors select{grid-row:2}.feedback{margin-top:12px}.model-note{margin-top:12px}}

<body>
<main class="shell">
  <header class="page-header">
    <div><p class="eyebrow">Ein interaktives Experiment</p><h1>Lineare Funktionen</h1></div>
    <a id="backLink" class="back-link" href="../">← Zur Physik</a>
  </header>
  <nav class="steps" aria-label="Lernschritte">
    <button type="button" data-step="0" aria-current="step"><span class="step-number">1</span><span>Steigung</span></button>
    <button type="button" data-step="1"><span class="step-number">2</span><span>Achsenabschnitt</span></button>
    <button type="button" data-step="2"><span class="step-number">3</span><span>Zusammenspiel</span></button>
    <button type="button" data-step="3"><span class="step-number">4</span><span>Anwenden</span></button>
  </nav>
  <div class="experiment">
    <section class="guide" aria-labelledby="guideTitle">
      <div class="guide-content">
        <p id="phaseLabel" class="eyebrow">Verändern & beobachten</p>
        <h2 id="guideTitle" tabindex="-1">Was verändert m?</h2>
        <p id="instruction" class="instruction"></p>
        <p id="observation" class="observation"></p>
        <div id="freeSelectors" class="free-selectors" hidden>
          <label for="contextSelect">Zusammenhang</label>
          <select id="contextSelect"><option value="math">Mathematik</option><option value="motion">Bewegung</option><option value="density">Masse und Volumen</option><option value="temperature">Temperatur</option><option value="electricity">Elektrizität</option></select>
          <label for="activitySelect">Was möchtest du tun?</label>
          <select id="activitySelect"><option value="explore">Experimentieren</option><option value="task">Auftrag lösen</option><option value="quiz">Quizfrage beantworten</option></select>
        </div>
        <div id="parameters" class="parameters">
          <div id="mControl" class="parameter parameter-m">
            <div class="parameter-label"><label id="mLabel" for="mRange">Steigung <i>m</i></label><input id="mNumber" type="number" aria-label="Wert der Steigung m" inputmode="decimal"></div>
            <input id="mRange" type="range" aria-labelledby="mLabel">
            <div class="range-limits" aria-hidden="true"><span id="mMin"></span><span id="mMax"></span></div>
          </div>
          <div id="bControl" class="parameter parameter-b" hidden>
            <div class="parameter-label"><label id="bLabel" for="bRange">Achsenabschnitt <i>b</i></label><input id="bNumber" type="number" aria-label="Wert des Achsenabschnitts b" inputmode="decimal"></div>
            <input id="bRange" type="range" aria-labelledby="bLabel">
            <div class="range-limits" aria-hidden="true"><span id="bMin"></span><span id="bMax"></span></div>
          </div>
        </div>
        <div id="answers" class="answers" role="group" aria-label="Deine Vermutung" hidden></div>
        <div id="feedback" class="feedback" role="status" hidden></div>
        <p id="modelNote" class="model-note" hidden></p>
      </div>
      <div class="guide-footer">
        <p id="readiness" class="readiness" aria-live="polite"></p>
        <button id="nextButton" class="primary" type="button">Weiter beobachten <span aria-hidden="true">→</span></button>
        <p id="nextHint" class="next-hint"></p>
        <button id="restartButton" class="text-button" type="button" hidden>Experiment von vorn beginnen</button>
      </div>
    </section>
    <section class="graph-section" aria-label="Dein Graph">
      <header class="graph-header"><div><span class="eyebrow" id="graphContext">Dein Graph</span><div id="equation" class="equation" aria-live="off"></div></div><span id="fixedNote" class="fixed-note">b bleibt bei 0</span></header>
      <div class="graph-stage" id="graphStage"><svg id="lineGraph" role="group" aria-label="Interaktives Koordinatensystem"></svg></div>
      <div id="graphTools" class="graph-tools" hidden>
        <button id="triangleToggle" type="button" aria-pressed="false">Steigungsdreieck</button>
        <button id="valuesToggle" type="button" aria-pressed="false">Werte ablesen</button>
        <button id="comparisonToggle" type="button" aria-pressed="false" hidden>Gerade merken</button>
        <button id="fitButton" type="button" hidden>Ansicht einpassen</button>
      </div>
      <section id="valuesPanel" class="values-panel" aria-label="Wertetabelle und Messpunkt" hidden>
        <div class="probe-control"><label id="probeLabel" for="probeRange">x</label><input id="probeRange" type="range"><output id="probeValue"></output></div>
        <table><caption class="sr-only">Wertetabelle der aktuellen Funktion</caption><tbody id="valueRows"></tbody></table>
      </section>
      <p class="graph-note" id="graphNote">Bewege den Regler oder den grünen Punkt im Graphen.</p>
    </section>
  </div>
  <footer class="page-footer"><span id="footerCopy">Erst verändern. Dann verstehen.</span><button id="freeButton" class="text-button" type="button">Direkt frei experimentieren ↗</button></footer>
  <p id="liveStatus" class="sr-only" aria-live="polite"></p>
</main>
<script>window.LINEAR_CONTEXTS = {
  "math": {
    "title": "Mathematik",
    "formulaGeneric": "f(x) = m · x + b",
    "lhsPlain": "f(x)",
    "x": {
      "symbolHtml": "x",
      "symbolPlain": "x",
      "name": "x-Wert",
      "axis": "x",
      "unit": "",
      "min": -6,
      "max": 6,
      "step": 0.5,
      "tick": 2,
      "probe": 2
    },
    "y": {
      "symbolHtml": "f(x)",
      "symbolPlain": "f(x)",
      "name": "Funktionswert",
      "axis": "y = f(x)",
      "unit": "",
      "min": -12,
      "max": 12,
      "tick": 4
    },
    "slope": {
      "symbolHtml": "m",
      "symbolPlain": "m",
      "name": "Steigung",
      "unit": "",
      "min": -4,
      "max": 4,
      "step": 0.25,
      "value": 1.5
    },
    "intercept": {
      "symbolHtml": "b",
      "symbolPlain": "b",
      "name": "y-Achsenabschnitt",
      "unit": "",
      "min": -8,
      "max": 8,
      "step": 0.5,
      "value": 2
    },
    "triangleDx": 3,
    "handleDx": 1,
    "tableXs": [
      -4,
      -2,
      0,
      2,
      4
    ],
    "modelNote": "Eine lineare Funktion ist für alle reellen x definiert. Im Diagramm siehst du nur den gewählten Ausschnitt.",
    "tasks": [
      {
        "prompt": "Stelle eine Gerade ein, die pro x-Einheit um 2 steigt und die y-Achse bei −3 schneidet.",
        "m": 2,
        "b": -3,
        "success": "Richtig: f(x) = 2 · x − 3."
      },
      {
        "prompt": "Stelle eine Gerade ein, die bei y = 4 beginnt und pro x-Einheit um 1,5 fällt.",
        "m": -1.5,
        "b": 4,
        "success": "Richtig: Eine fallende Gerade besitzt eine negative Steigung."
      },
      {
        "prompt": "Bei x = 0 soll y = −2 sein. Wenn x um 2 wächst, soll y um 5 wachsen.",
        "m": 2.5,
        "b": -2,
        "success": "Richtig: m = Δy / Δx = 5 / 2 = 2,5."
      }
    ],
    "understanding": [
      {
        "kind": "Steigung deuten",
        "prompt": "Was bedeutet m = −2?",
        "answers": [
          "Von links nach rechts fällt die Gerade pro x-Einheit um 2.",
          "Die Gerade schneidet die y-Achse bei −2.",
          "Die gesamte Gerade liegt unterhalb der x-Achse."
        ],
        "correct": 0,
        "explanation": "Das Vorzeichen beschreibt die Richtung; der Betrag 2 beschreibt die Änderung pro x-Einheit.",
        "visual": {
          "type": "line",
          "m": -2,
          "b": 2
        },
        "graph": {
          "m": -2,
          "b": 2
        }
      },
      {
        "kind": "Achsenabschnitt",
        "prompt": "Was beschreibt b in f(x) = m · x + b?",
        "answers": [
          "Die Nullstelle der Funktion.",
          "Den Funktionswert bei x = 0.",
          "Die Änderung von x pro y-Einheit."
        ],
        "correct": 1,
        "explanation": "Setzt man x = 0, bleibt f(0) = b.",
        "visual": {
          "type": "intercept",
          "m": 1,
          "b": 2
        },
        "graph": {
          "m": 1,
          "b": 2
        }
      },
      {
        "kind": "Sonderfall",
        "prompt": "Wie sieht der Graph für m = 0 aus?",
        "answers": [
          "Senkrecht.",
          "Er verläuft immer durch den Ursprung.",
          "Waagrecht bei y = b."
        ],
        "correct": 2,
        "explanation": "Ohne Änderung bleibt der Funktionswert für alle x gleich b.",
        "visual": {
          "type": "line",
          "m": 0,
          "b": 2
        },
        "graph": {
          "m": 0,
          "b": 2
        }
      },
      {
        "kind": "Parameter verändern",
        "prompt": "Nur b wird größer. Was geschieht mit der Geraden?",
        "answers": [
          "Sie wird steiler.",
          "Sie wird parallel nach oben verschoben.",
          "Sie dreht sich um den Ursprung."
        ],
        "correct": 1,
        "explanation": "Die Steigung bleibt gleich; jeder Funktionswert wird um denselben Betrag größer.",
        "visual": {
          "type": "parallel",
          "m": 1,
          "b": -1,
          "b2": 2
        },
        "graph": {
          "m": 1,
          "b": -1,
          "comparison": {
            "m": 1,
            "b": 2
          }
        }
      }
    ],
    "application": [
      {
        "kind": "Einsetzen",
        "prompt": "Für f(x) = −1,5 · x + 4: Welchen Wert hat f(x) bei x = 2?",
        "answers": [
          "1",
          "2,5",
          "7"
        ],
        "correct": 0,
        "explanation": "f(2) = −1,5 · 2 + 4 = 1.",
        "graph": {
          "m": -1.5,
          "b": 4
        }
      },
      {
        "kind": "Steigung berechnen",
        "prompt": "Eine Gerade geht durch (1 | 2) und (3 | 8). Wie groß ist ihre Steigung?",
        "answers": [
          "2",
          "3",
          "6"
        ],
        "correct": 1,
        "explanation": "m = (8 − 2) / (3 − 1) = 6 / 2 = 3.",
        "graph": {
          "m": 3,
          "b": -1
        }
      },
      {
        "kind": "Formel zuordnen",
        "prompt": "Welche Formel hat die Steigung 2,5 und den y-Achsenabschnitt −2?",
        "answers": [
          "f(x) = −2 · x + 2,5",
          "f(x) = 2,5 · x + 2",
          "f(x) = 2,5 · x − 2"
        ],
        "correct": 2,
        "explanation": "Die Steigung steht vor x, der Achsenabschnitt wird addiert.",
        "graph": {
          "m": 2.5,
          "b": -2
        }
      }
    ]
  },
  "motion": {
    "title": "Bewegung",
    "formulaGeneric": "x(t) = v · t + x_0",
    "lhsPlain": "x(t)",
    "x": {
      "symbolHtml": "t",
      "symbolPlain": "t",
      "name": "Zeit",
      "axis": "Zeit t",
      "unit": "s",
      "min": 0,
      "max": 10,
      "step": 0.5,
      "tick": 2,
      "probe": 4
    },
    "y": {
      "symbolHtml": "x",
      "symbolPlain": "x",
      "name": "Ort",
      "axis": "Ort x",
      "unit": "m",
      "min": -35,
      "max": 50,
      "tick": 10
    },
    "slope": {
      "symbolHtml": "v",
      "symbolPlain": "v",
      "name": "Geschwindigkeit",
      "unit": "m/s",
      "min": -4,
      "max": 4,
      "step": 0.5,
      "value": 1.5
    },
    "intercept": {
      "symbolHtml": "x<sub>0</sub>",
      "symbolPlain": "x_0",
      "name": "Anfangsort",
      "unit": "m",
      "min": -10,
      "max": 10,
      "step": 1,
      "value": 2
    },
    "triangleDx": 5,
    "handleDx": 2,
    "tableXs": [
      0,
      2,
      4,
      6,
      8
    ],
    "modelNote": "Das Modell gilt für eine gleichförmige Bewegung: Die Geschwindigkeit bleibt im betrachteten Zeitraum konstant.",
    "tasks": [
      {
        "prompt": "Ein Körper startet bei 6 m und bewegt sich mit 1,5 m/s in positive Richtung.",
        "m": 1.5,
        "b": 6,
        "success": "Richtig: x(t) = (1,5 m/s) · t + 6 m."

<script>(function () {

    if(state.step===0)return {label:"Ein besonderer Fall",title:"Setze m auf null.",instruction:"Stelle m = 0 ein. Du kannst die Zahl auch direkt eingeben.",observe:"Beobachte, wie die Gerade jetzt verläuft.",button:"Meine Vermutung prüfen",hint:"Danach: deine Beobachtung in Worte fassen.",ready:near(state.m,0)?"m = 0 ist eingestellt.":"Stelle die Steigung auf 0."};
    if(state.step===1)return {label:"Verändern & beobachten",title:"Was verändert b?",instruction:"Verändere b nach oben und nach unten.",observe:"Beobachte besonders den Schnittpunkt mit der y-Achse.",button:"Meine Vermutung prüfen",hint:"Danach: Was ist gleich geblieben?",ready:state.changed?"Vergleiche die Lage der Geraden.":"Bewege zuerst den Regler für b."};
    if(state.step===2)return {label:"Beide Parameter",title:"Baue deine Gerade.",instruction:"Stelle m = 2 und b = 1 ein.",observe:"Vergleiche die Werte mit der Gleichung über dem Graphen.",button:"Einen Wert vorhersagen",hint:"Danach: Welcher y-Wert gehört zu x = 2?",ready:ready()?"Beide Werte passen.":"Gesucht: m = 2 und b = 1."};
    if(state.phase<3)return {label:"Auftrag "+state.phase+" von 2",title:"Jetzt bist du dran.",instruction:currentTask().prompt,observe:"Verändere m und b. Prüfe, wenn deine Gerade passt.",button:state.solved?(state.phase===1?"Nächster Auftrag":"Experiment abschliessen"):"Gerade prüfen",hint:state.phase===1?"Danach: eine fallende Gerade.":"Danach: frei weiterforschen.",ready:""};
    return {label:"Experiment abgeschlossen",title:"Zwei Werte. Eine Gerade.",instruction:"m bestimmt die Steigung. b bestimmt den Schnittpunkt mit der y-Achse.",observe:"Erkunde jetzt eigene Geraden oder wende die Idee auf die Physik an.",button:"Frei weiterforschen",hint:"Mit Wertetabelle, Vergleich und weiteren Aufträgen.",ready:"Alle vier Schritte entdeckt."};
  }
  function renderGuide(){
    const copy=guideCopy();$("phaseLabel").textContent=copy.label;$("guideTitle").textContent=copy.title;$("instruction").textContent=copy.instruction;$("observation").textContent=copy.observe;$("observation").hidden=Boolean(state.message);
    $("nextButton").innerHTML=escape(copy.button)+"<span aria-hidden='true'>→</span>";$("nextButton").disabled=!ready();$("readiness").textContent=copy.ready;$("nextHint").textContent=copy.hint;
    $("feedback").hidden=!state.message;$("feedback").textContent=state.message;$("feedback").classList.toggle("retry",state.retry);
    $("freeSelectors").hidden=!state.free;$("contextSelect").value=state.context;$("activitySelect").value=state.activity;$("restartButton").hidden=!(state.free||state.step===3&&state.phase===3);
    $("modelNote").hidden=!state.free||state.context==="math";$("modelNote").textContent=context().modelNote;
    const q=question();$("answers").hidden=!q;
    if(q){const key=[state.free,state.context,state.step,state.phase,state.quiz].join("/");if(answerKey!==key){$("answers").innerHTML=q.answers.map((a,i)=>"<button type='button' data-answer='"+i+"' aria-pressed='false'>"+escape(a)+"</button>").join("");answerKey=key;}
      $("answers").querySelectorAll("button").forEach((button,i)=>{button.disabled=state.solved;button.setAttribute("aria-pressed",String(state.choice===i));button.classList.toggle("wrong",state.retry&&state.choice===i);});}
    document.querySelectorAll("[data-step]").forEach(button=>{const n=Number(button.dataset.step);if(n===state.step)button.setAttribute("aria-current","step");else button.removeAttribute("aria-current");button.classList.toggle("done",state.completed[n]);});
    $("freeButton").hidden=state.free;$("footerCopy").textContent=state.free?"Ein Zusammenhang. Verschiedene Bedeutungen.":"Erst verändern. Dann verstehen.";
  }
  function renderParameters(normalize=false){
    const c=context(),allow=permissions();
    $("parameters").hidden=!allow.m&&!allow.b;
    for(const key of ["m","b"]){const def=key==="m"?c.slope:c.intercept;const show=state.free||state.step>=2||(state.step===0?key==="m":key==="b");$(key+"Control").hidden=!show;
      $(key+"Label").innerHTML=escape(def.name)+" <i>"+notation(def.symbolPlain)+"</i>";
      for(const kind of ["Range","Number"]){const input=$(key+kind);input.min=def.min;input.max=def.max;input.step=def.step;if(normalize||input!==document.activeElement||kind==="Range")input.value=String(state[key]);input.disabled=!allow[key];}
      $(key+"Number").setAttribute("aria-label",def.name+" "+def.symbolPlain+(def.unit?" in "+def.unit:""));
      $(key+"Min").textContent=fmt(def.min)+(def.unit?" "+def.unit:"");$(key+"Max").textContent=fmt(def.max)+(def.unit?" "+def.unit:"");
    }
  }
  function renderEquation(){
    const c=context(), math=state.context==="math";const m=fmt(state.m),b=fmt(Math.abs(state.b));
    const mText=math?m:"("+m+(c.slope.unit?" "+c.slope.unit:"")+")";
    const bText=b+(math||!c.intercept.unit?"":" "+c.intercept.unit);
    $("equation").innerHTML=(math?"y":notation(c.lhsPlain))+" = <span class='"+(state.active==="m"?"active-m":"")+"'>"+escape(mText)+"</span> · "+(math?"x":notation(c.x.symbolPlain))+" "+(state.b<0?"−":"+")+" <span class='"+(state.active==="b"?"active-b":"")+"'>"+escape(bText)+"</span>";
    $("equation").setAttribute("aria-label",(math?"y":c.lhsPlain)+" = "+mText+" mal "+c.x.symbolPlain+(state.b<0?" minus ":" plus ")+bText);
    if(state.free&&state.activity==="quiz"&&!state.solved){$("equation").innerHTML=notation(c.formulaGeneric);$("equation").setAttribute("aria-label",c.formulaGeneric);}
    $("graphContext").textContent=state.free?c.title:"Dein Graph · y = mx + b";
    $("fixedNote").textContent=state.free?"":state.step===0?"b bleibt bei 0":state.step===1?"m bleibt bei 1":state.step===3&&state.phase===0?"b bleibt bei 1":"";
  }
  function renderValues(){
    const c=context(),visible=canUseTools()&&state.values;$("valuesPanel").hidden=!visible;
    if(!visible)return;
    const input=$("probeRange");input.min=c.x.min;input.max=c.x.max;input.step=c.x.step;input.value=state.probe;
    $("probeLabel").textContent=c.x.symbolPlain+(c.x.unit?" / "+c.x.unit:"");
    $("probeValue").textContent=fmt(state.probe)+" → "+fmt(valueAt(state.probe))+(c.y.unit?" "+c.y.unit:"");
    $("valueRows").innerHTML="<tr><th scope='row'>"+notation(c.x.symbolPlain)+(c.x.unit?" / "+escape(c.x.unit):"")+"</th>"+c.tableXs.map(x=>"<td>"+fmt(x)+"</td>").join("")+"</tr><tr><th scope='row'>"+notation(c.y.symbolPlain)+(c.y.unit?" / "+escape(c.y.unit):"")+"</th>"+c.tableXs.map(x=>"<td>"+fmt(valueAt(x))+"</td>").join("")+"</tr>";
  }
  function renderPlot(){
    const allow=permissions(),tools=canUseTools();
    graph.render({m:state.m,b:state.b,context:context(),view,triangle:tools&&state.triangle,probe:tools&&state.values?state.probe:null,comparison:state.comparison,allowM:allow.m,allowB:allow.b,activeParameter:state.active,interceptMark:state.step===1||state.step===2||state.free});
  }
  function render(){
    renderGuide();renderParameters();renderEquation();
    const tools=canUseTools();$("graphTools").hidden=!tools;
    $("triangleToggle").setAttribute("aria-pressed",String(state.triangle));$("valuesToggle").setAttribute("aria-pressed",String(state.values));
    $("comparisonToggle").hidden=!state.free||state.activity==="quiz";$("fitButton").hidden=!state.free;
    $("comparisonToggle").setAttribute("aria-pressed",String(!!state.comparison));$("comparisonToggle").textContent=state.comparison?"Vergleich entfernen":"Gerade merken";
    $("graphNote").textContent=state.comparison?"Gestrichelt: die Vergleichsgerade. Die Achsenskalierung bleibt gleich.":state.free?"Regler und Punkte verändern dieselbe Gerade. Pfeiltasten bewegen den fokussierten Punkt.":state.step===0?"Bewege den Regler oder den grünen Punkt im Graphen.":state.step===1?"Der orange Punkt liegt auf der y-Achse.":"Grün: Steigung m. Orange: Achsenabschnitt b.";
    renderValues();renderPlot();
  }
  for(const key of ["m","b"]){$(key+"Range").addEventListener("input",event=>setParameter(key,event.target.value));$(key+"Number").addEventListener("input",event=>{if(event.target.value.trim()!==""&&Number.isFinite(event.target.valueAsNumber))setParameter(key,event.target.valueAsNumber);});$(key+"Number").addEventListener("change",()=>renderParameters(true));}
  document.querySelectorAll("[data-step]").forEach(button=>button.addEventListener("click",()=>enterStep(Number(button.dataset.step))));
  $("answers").addEventListener("click",event=>{const button=event.target.closest("[data-answer]");if(button)answer(Number(button.dataset.answer));});
  $("nextButton").addEventListener("click",next);$("freeButton").addEventListener("click",()=>enterFree());$("restartButton").addEventListener("click",()=>{state.completed=[false,false,false,false];enterStep(0);});
  $("contextSelect").addEventListener("change",event=>enterFree(event.target.value));$("activitySelect").addEventListener("change",event=>setActivity(event.target.value));
  $("triangleToggle").addEventListener("click",()=>{state.triangle=!state.triangle;render();});$("valuesToggle").addEventListener("click",()=>{state.values=!state.values;render();});
  $("comparisonToggle").addEventListener("click",()=>{state.comparison=state.comparison?null:{m:state.m,b:state.b};render();});
  $("probeRange").addEventListener("input",event=>{state.probe=Number(event.target.value);renderValues();renderPlot();});
  $("fitButton").addEventListener("click",()=>{const c=context(),values=[0,state.b,valueAt(c.x.min),valueAt(c.x.max)];if(state.comparison)values.push(state.comparison.m*c.x.min+state.comparison.b,state.comparison.m*c.x.max+state.comparison.b);const min=Math.min(...values),max=Math.max(...values),span=Math.max(max-min,2),raw=span/6,power=10**Math.floor(Math.log10(raw)),step=([1,2,5,10].find(x=>x*power>=raw)||10)*power;view={yMin:Math.floor((min-span*.1)/step)*step,yMax:Math.ceil((max+span*.1)/step)*step,tickStep:step};renderPlot();});
  function resize(){if(resizeFrame)return;resizeFrame=requestAnimationFrame(()=>{resizeFrame=0;renderPlot();});}
  if(window.ResizeObserver)new ResizeObserver(resize).observe($("graphStage"));else window.addEventListener("resize",resize);
  const params=new URLSearchParams(location.search),from=params.get("from")||(document.referrer.includes("/gymi/")?"gymnasium":document.referrer.includes("/fms/")?"fms":null);
  if(document.body.dataset.standalone==="true"){$("backLink").href="https://alecstrassen.github.io/astrassen/physik/fms/simulationen/";$("backLink").textContent="Zur Website ↗";}
  else if(from==="gymnasium"||from==="fms"){$("backLink").href=from==="gymnasium"?"../gymi/simulationen/":"../fms/simulationen/";$("backLink").textContent=from==="gymnasium"?"← Gymnasium-Simulationen":"← FMS-Simulationen";}
  const requested=params.get("kontext");if(requested&&requested!=="math"&&contexts[requested])enterFree(requested);else enterStep(0,false);
}());</script>
